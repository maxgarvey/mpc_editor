{{define "move_dirs.html"}}
<div class="move-dirs-breadcrumbs">
    {{range $i, $b := .Breadcrumbs}}{{if $i}}<span class="breadcrumb-sep">/</span>{{end}}<button type="button" class="breadcrumb-link btn-link" hx-get="/workspace/dirs?dir={{$b.Path}}" hx-target="#move-dirs-container">{{$b.Name}}</button>{{end}}
</div>
<div class="move-dirs-list">
    {{if not .Dirs}}
    <div class="browser-empty">No subdirectories</div>
    {{end}}
    {{range .Dirs}}
    <div class="move-dir-entry"
         data-path="{{.Path}}"
         hx-get="/workspace/dirs?dir={{.Path}}"
         hx-target="#move-dirs-container"
         hx-trigger="dblclick">
        <span class="entry-icon">{{template "icon-folder" .}}</span>
        <span class="entry-name">{{.Name}}</span>
    </div>
    {{end}}
</div>
<input type="hidden" id="move-current-dir" value="{{.CurrentDir}}">
{{end}}
